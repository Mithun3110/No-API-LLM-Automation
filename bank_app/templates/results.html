{% extends "base.html" %}
{% block title %}Search Results{% endblock %}
{% block content %}
<h2><font face="Verdana">Search Results</font></h2>
<font face="Verdana" size="2">{{ rows|length }} member(s) matching "{{ query }}"</font><br><br>
<table border="1" cellpadding="4" cellspacing="0" bordercolor="#808080" width="100%">
  <tr bgcolor="#003366"><td><font face="Verdana" size="2" color="#ffffff"><b>Member ID</b></font></td>
      <td><font face="Verdana" size="2" color="#ffffff"><b>Name</b></font></td></tr>
  {% for r in rows %}
  <tr bgcolor="{{ loop.cycle('#ffffff', '#eeeeee') }}">
    <td><font face="Verdana" size="2"><a href="{{ url_for('member_detail', member_id=r.member_id) }}">{{ r.member_id }}</a></font></td>
    <td><font face="Verdana" size="2">{{ r.name }}</font></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
